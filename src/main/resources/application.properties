#FOR ENV FILE
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/habiterra}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
auth.jwt.secret=${JWT_SECRET}
auth.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
auth.registration.secret=${REGISTRATION_TOKEN_SECRET}
auth.registration.expiration-seconds=${REGISTRATION_EXPIRATION_SECONDS:600}
auth.otp.cooldown-seconds=${OTP_COOLDOWN_SECONDS:60}
auth.otp.dev-mode=${OTP_DEV_MODE:false}
auth.otp.hourly-limit=${OTP_HOURLY_LIMIT:5}
auth.http.requests-per-minute=${AUTH_REQUESTS_PER_MINUTE:30}
auth.cors.origins=${CORS_ALLOWED_ORIGINS:}
auth.mail.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Infrastructure documentation stays outside the versioned business API.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/v1/**
# Document only the responses declared for each operation, not every advice handler.
springdoc.override-with-generic-response=false

